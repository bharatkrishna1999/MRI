services:
  - type: web
    name: merchant-risk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      # Optional. Google Safe Browsing v4 is free but needs a key. Without one
      # the engine falls back to a keyless Spamhaus DBL DNS lookup, and if that
      # is unreachable the reputation signal drops out of the denominator.
      - key: SAFE_BROWSING_API_KEY
        sync: false
      # Optional, and the one variable worth setting: with a key here the two
      # plain-English summaries are rewritten by gemini-2.5-flash-lite after the
      # decision is final, and without one the engine's own wording ships. The
      # lite model is the free tier's workhorse since the December 2025 quota
      # cuts; if it is unavailable the app falls back through the other free
      # models on its own. A key is free at aistudio.google.com/apikey and needs
      # no billing account. Set the value in the Render dashboard — sync: false
      # keeps it out of this file. Confirm it is live at /api/v1/narration/check.
      - key: GEMINI_API_KEY
        sync: false
      - key: MRI_PUBLIC_URL
        sync: false
