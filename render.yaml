services:
  - type: web
    name: merchant-risk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      # Optional. Google Safe Browsing v4 is free but needs a key. Without one
      # the engine falls back to a keyless Spamhaus DBL DNS lookup, and if that
      # is unreachable the reputation signal drops out of the denominator.
      - key: SAFE_BROWSING_API_KEY
        sync: false
      # Optional, and the one variable worth setting. It buys two things:
      # gemini-2.5-flash-lite rewrites the two plain-English summaries, and it
      # reads the finished score sheet and sets the decision band. Without a key
      # the engine's own wording and the policy's own arithmetic ship, which is
      # a complete product; with one, the model can correct a band the weighted
      # average got wrong. What it may not do is capped in code — see
      # adjudicator.MODEL_CAPS — and every failure falls back to the policy's
      # band. The lite model is the free tier's workhorse since the December
      # 2025 quota cuts; if it is unavailable the app falls back through the
      # other free models on its own. A key is free at aistudio.google.com/apikey
      # and needs no billing account. Set the value in the Render dashboard —
      # sync: false keeps it out of this file. Confirm both are live at
      # /api/v1/narration/check and /api/v1/adjudicator/check.
      - key: GEMINI_API_KEY
        sync: false
      # How much authority the model gets: binding (the default once a key is
      # set — the model's band is the decision), advisory (asked and recorded,
      # the policy's band ships) or off. Start on advisory if you want to read a
      # week of its disagreements before handing it the decision.
      - key: MRI_ADJUDICATOR
        sync: false
      - key: MRI_PUBLIC_URL
        sync: false
