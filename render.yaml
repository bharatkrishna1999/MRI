services:
  - type: web
    name: merchant-risk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      # Optional. Google Safe Browsing v4 is free but needs a key. Without one
      # the engine falls back to a keyless Spamhaus DBL DNS lookup, and if that
      # is unreachable the reputation signal drops out of the denominator.
      - key: SAFE_BROWSING_API_KEY
        sync: false
      # Optional. Google AI Studio key, free tier. With one set, the two
      # plain-English summaries are rewritten by gemini-2.5-flash after the
      # decision is final; without one the engine's own wording ships. Set the
      # value in the Render dashboard — sync: false keeps it out of this file.
      - key: GEMINI_API_KEY
        sync: false
      - key: MRI_PUBLIC_URL
        sync: false
